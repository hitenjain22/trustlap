[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlap"
version = "0.1.0"
description = "GPU-parallel driving simulator and self-play RL training for TrustLap."
license = { text = "MIT" }
authors = [{ name = "Hiten Jain" }]
requires-python = ">=3.10"
# Unpinned until the first working Colab/Kaggle install (SPEC M0.3); then pin and record in RUNBOOK.md.
# JAX's CUDA flavor is deliberately NOT listed: notebooks install the right build for their runtime.
dependencies = [
    "jax",
    "flax",
    "optax",
    "distrax",
    "chex",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["trustlap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY"]
